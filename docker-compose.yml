services:
  servidor:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: servidor-telematica
    restart: unless-stopped
    environment:
      PUERTO_TCP: 5000
      PUERTO_UDP: 5000
      NODOS_REGISTRADOS: NODE01,NODE02,NODE03,NODE04,NODE05
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"

  webservice:
    build:
      context: ./interface/webservice
      dockerfile: Dockerfile
    container_name: webservice-telematica
    restart: unless-stopped
    depends_on:
      - servidor
    environment:
      # "servidor" es el nombre del otro servicio de este mismo compose;
      # Docker lo resuelve internamente, no hace falta IP ni localhost.
      SERVER_HOST: servidor
      SERVER_PORT: 5000
      WEB_PORT: 8080
    ports:
      - "8080:8080/tcp"
